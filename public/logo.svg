<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 264 64" width="264" height="64" fill="none">
  <defs>
    <!-- Degradado Índigo acorde a los botones de tu web -->
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#3730A3" />
    </linearGradient>
    <!-- Sombra suave estilo Clean UI -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- ISOTIPO: Contenedor redondeado oscuro estilo Next/Vercel -->
  <rect x="3" y="6" width="52" height="52" rx="14" fill="#0F172A" filter="url(#softShadow)" />
  
  <!-- Detalle de borde interior sutil -->
  <rect x="3.5" y="6.5" width="51" height="51" rx="13.5" stroke="#334155" stroke-opacity="0.4" />

  <!-- Monograma geométrico 'J' + '>' (Velocidad / Código) -->
  <!-- Letra J minimalista en blanco -->
  <path d="M23 20V36C23 39.3137 20.3137 42 17 42H15" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Símbolo '>' / Flecha de alto rendimiento en Azul Índigo formando la G/acción -->
  <path d="M30 22L40 32L30 42" stroke="#4F46E5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Punto indicador de rendimiento (Verde Esmeralda 100/100 CWV) -->
  <circle cx="43" cy="18" r="3" fill="#10B981" />

  <!-- LOGOTIPO TIPOGRÁFICO -->
  <!-- Nombre principal: Jesús Gajate -->
  <text x="66" y="34" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="800" font-size="23" fill="#0F172A" letter-spacing="-0.03em">
    Jesús Gajate
  </text>

  <!-- Badge 'dev' en estilo código/píldora -->
  <rect x="212" y="16" width="44" height="23" rx="6" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.2" />
  <text x="234" y="32.5" font-family="JetBrains Mono, monospace, sans-serif" font-weight="700" font-size="13" fill="#4F46E5" text-anchor="middle">
    .dev
  </text>

  <!-- Subtítulo técnico -->
  <text x="67" y="51" font-family="JetBrains Mono, monospace, sans-serif" font-weight="700" font-size="11" fill="#475569" letter-spacing="0.09em">
    WEB &amp; GEO PARTNER
  </text>
</svg>